name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Smoke clean
        run: callstorm examples/clean.jsonl
      - name: Smoke stormy gate
        run: |
          set +e
          callstorm examples/stormy.jsonl --fail-on retry_storm
          code=$?
          set -e
          test "$code" -eq 3
